<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Home Manager{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <div class="header-inner">
            <h1><a href="{{ url_for('dashboard') }}">Home Manager Dashboard</a></h1>
            {% if session.get('user_name') %}
            <div class="user-menu">
                <span>사용자 : {{ session.get('user_name') }}</span>
                <a class="logout-button" href="{{ url_for('logout') }}">로그아웃</a>
            </div>
            {% endif %}
        </div>
    </header>
    <main>{% block content %}{% endblock %}</main>
</body>
</html>
